# This file is used to test config loading in cmd/main_test.go. Any updates
# to this file should be reflected in the test file.
flows:
  # if either authentication_url or authorization_url is not provided for a
  # flow, they will be assumed to be always allowed
  - name: example authenticator
    domains:
      - example.com
      - "*.example.com"
    authentication_url: https://example.com/auth
    authorization_url: http://localhost:8181/v1/data/example/allow
  - name: test authenticator
    domains:
      - test.com
      - "*.test.com"
    authentication_url: https://test.com/auth
    authorization_url: http://localhost:8181/v1/data/test/allow
keycloak:
  keycloak_url: http://localhost:8080/auth
  realm: myrealm
  client_id: myclient
  client_secret: mysecret
database:
  # drivers "sqlite3" and "pgx" are supported
  driver: sqlite3
  source: ./db.sqlite3
  # driver: pgx
  # source: postgres://{{.SQL_USER}}:{{.SQL_PASSWORD}}@{{.SQL_HOST}}/{{.SQL_DATABASE}}
api_token:
  prefix: ABCD
  secret: {{.API_SECRET}}
