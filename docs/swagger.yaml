definitions:
  v1.CreateTokenResponse:
    properties:
      created:
        type: string
      expiry:
        type: string
      id:
        type: string
      name:
        type: string
      scope:
        type: string
      token:
        type: string
      user_id:
        type: string
      workspace:
        type: string
    type: object
  v1.GetTokenResponse:
    properties:
      created:
        type: string
      expiry:
        type: string
      id:
        type: string
      name:
        type: string
      scope:
        type: string
      user_id:
        type: string
      workspace:
        type: string
    type: object
info:
  contact: {}
  description: This is the API for the UK EO DataHub Auth Agent.
  title: EODHP Auth Agent API
  version: v1
paths:
  /workspaces/{workspace}/{user-id}/tokens:
    get:
      consumes:
      - application/json
      description: Get workspace user tokens. {user-id} can be set to "me" to use
        the token owner's user id.
      parameters:
      - description: Workspace ID
        example: my-workspace
        in: path
        name: workspace
        required: true
        type: string
      - description: User ID
        example: me
        in: path
        name: user-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1.GetTokenResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get workspace user tokens
      tags:
      - api-token workspace
    post:
      consumes:
      - application/json
      description: Create workspace a user token. {user-id} can be set to "me" to
        use the token owner's user id.
      parameters:
      - description: Workspace ID
        example: my-workspace
        in: path
        name: workspace
        required: true
        type: string
      - description: User ID
        example: me
        in: path
        name: user-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.CreateTokenResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create workspace user tokens
      tags:
      - api-token workspace
  /workspaces/{workspace}/{user-id}/tokens/{token-id}:
    delete:
      consumes:
      - application/json
      description: Delete a workspace user token by ID. {user-id} can be set to "me"
        to use the token owner's user id.
      parameters:
      - description: Workspace ID
        example: my-workspace
        in: path
        name: workspace
        required: true
        type: string
      - description: User ID
        example: me
        in: path
        name: user-id
        required: true
        type: string
      - description: Token ID
        example: 454f4448000000000000000000000000
        in: path
        name: token-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete workspace user token
      tags:
      - api-token workspace
    get:
      consumes:
      - application/json
      description: Get a workspace user token by ID. {user-id} can be set to "me"
        to use the token owner's user id.
      parameters:
      - description: Workspace ID
        example: my-workspace
        in: path
        name: workspace
        required: true
        type: string
      - description: User ID
        example: me
        in: path
        name: user-id
        required: true
        type: string
      - description: Token ID
        example: 454f4448000000000000000000000000
        in: path
        name: token-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.GetTokenResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get workspace user token
      tags:
      - api-token workspace
swagger: "2.0"
